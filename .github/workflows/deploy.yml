# ============================================================
#  CI + Sécurité — Backend Easy Sales  (pipeline multi-jobs)
#  Déclenché à chaque "git push" sur develop (+ bouton manuel).
#
#  Graphe des jobs :
#     tests ──► build ──┬──► sonarcloud (SAST)
#                       └──► image-scan-push ──► dast-zap (DAST)
#     sca-owasp   (parallèle, SCA dépendances)
#     trivy-fs    (parallèle, scan code/dépendances)
#
#  ⚠️ Scans NON-BLOQUANTS pour l'instant (continue-on-error) : ils
#     produisent un rapport mais ne cassent pas le pipeline. On les
#     rendra bloquants un par un une fois validés.
#
#  ⚠️ Déploiement (CD) MANUEL (tenant ESPRIT bloque l'identité Azure) :
#       az containerapp update --name easysales-backend \
#         --resource-group easysales-rg \
#         --image easysalesacrm.azurecr.io/easysales-backend:latest
#
#  Secrets/variables GitHub :
#    - ACR_USERNAME / ACR_PASSWORD : push image                 ✅ requis
#    - SONAR_TOKEN                 : SonarCloud (sinon job sauté)
# ============================================================

name: CI + Securite backend

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: easysalesacrm.azurecr.io
  IMAGE_NAME: easysales-backend
  # URL publique du backend (pour le scan DAST ZAP). ⚠️ change à chaque destroy/recreate.
  APP_URL: https://easysales-backend.bravemoss-1c5a2f5c.francecentral.azurecontainerapps.io/api

jobs:

  # ---------- 1) TESTS ----------
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Non-bloquant POUR L'INSTANT : si les tests passent au vert, enlève
      # "continue-on-error" pour rendre cette porte de qualité BLOQUANTE.
      - name: Lancer les tests (Maven)
        continue-on-error: true
        run: ./mvnw -B test

  # ---------- 2) BUILD du .jar (partagé via artefact) ----------
  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compiler le .jar
        run: ./mvnw -B clean package -DskipTests
      - name: Publier le .jar (artefact réutilisé par le job image)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ---------- 3) SCA — OWASP Dependency-Check (parallèle) ----------
  sca-owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check (failles des librairies)
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: easysales-backend
          path: '.'
          format: 'HTML'
          args: >-
            --failOnCVSS 11
            --enableRetired
      - name: Publier le rapport OWASP (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-owasp
          path: reports
          if-no-files-found: ignore

  # ---------- 4) Trivy filesystem — scan code + dépendances (parallèle) ----------
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan du code/dépendances (Trivy filesystem)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  # ---------- 5) SAST — SonarCloud (après build) ----------
  sonarcloud:
    runs-on: ubuntu-latest
    needs: build
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Sonar a besoin de tout l'historique
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Si SONAR_TOKEN n'est pas configuré -> on sort proprement (vert),
      # sinon on lance l'analyse. ⚠️ remplace org / projectKey par les tiens.
      - name: Analyse SonarCloud (SAST)
        continue-on-error: true
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN non configuré -> étape SonarCloud sautée (à activer plus tard)."
            exit 0
          fi
          ./mvnw -B verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=DorsafRH \
            -Dsonar.projectKey=DorsafRH_Easy-Sales-CRM-Backend \
            -DskipTests

  # ---------- 6) Image : build + scan Trivy + push ACR (après build) ----------
  image-scan-push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le .jar compilé (artefact du job build)
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - name: Connexion à l'ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_LOGIN_SERVER }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin
      - name: Build de l'image Docker
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      # Télécharge le template HTML officiel de Trivy (rapports lisibles pour le jury)
      - name: Télécharger le template HTML de Trivy
        run: curl -sSL -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      # Scan de l'IMAGE -> rapport HTML. Non-bloquant (exit-code 0).
      # Pour le rendre BLOQUANT plus tard : retire "continue-on-error" et mets exit-code '1'.
      - name: Scan de l'image (Trivy -> HTML)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: template
          template: '@html.tpl'
          output: trivy-image-report.html
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload du rapport Trivy image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.html
          retention-days: 14
          if-no-files-found: ignore

      # Scan des MAUVAISES CONFIGURATIONS (Dockerfile + Terraform/IaC) -> rapport HTML
      - name: Scan des misconfigurations (Trivy config / IaC)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          format: template
          template: '@html.tpl'
          output: trivy-config-report.html

      - name: Upload du rapport Trivy config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config-report.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Push de l'image vers l'ACR
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ---------- 7) DAST — OWASP ZAP sur l'app en ligne (après push) ----------
  dast-zap:
    runs-on: ubuntu-latest
    needs: image-scan-push
    steps:
      - name: Scan dynamique (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: ${{ env.APP_URL }}
          fail_action: false
          allow_issue_writing: false

      # Récupère le rapport HTML de ZAP comme artefact téléchargeable
      - name: Upload du rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30
          if-no-files-found: ignore
