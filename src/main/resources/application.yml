spring:
  application:
    name: crm-backend
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.crm: DEBUG
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  packages-to-scan: com.crm

admin:
  default:
    email: ${ADMIN_EMAIL:admin@easysalescrm.com}
    password: ${ADMIN_PASSWORD}
    nom: ${ADMIN_NOM:Super}
    prenom: ${ADMIN_PRENOM:Admin}

# ===== SPRINT 4 - MARKETING IA =====
groq:
  api:
    key: ${GROQ_API_KEY}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:llama-3.1-8b-instant}

meta:
  oauth:
    app-id: ${META_APP_ID}
    app-secret: ${META_APP_SECRET}
    redirect-uri: ${META_REDIRECT_URI}
    graph-api-version: v21.0